[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-scanner"
version = "0.1.0"
description = "Scanner multiinstrumento de futuros (ES/NQ/GC) con replay causal, setups de order flow y modelo probabilistico calibrado. Investigacion y paper; cuenta real deshabilitada."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "tzdata>=2024.1",
  "numpy>=1.26",
  "databento>=0.40",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
